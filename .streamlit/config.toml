# Streamlit Configuration
# Save to .streamlit/config.toml

[theme]
primaryColor = "#FF0000"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1C1C1C"
textColor = "#FFFFFF"
font = "sans serif"

[client]
showErrorDetails = true

[logger]
level = "info"

[server]
port = 8501
headless = true
runOnSave = true
